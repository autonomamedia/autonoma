<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autonoma - Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            autonoma: {
              cyan: '#22d3ee',
              purple: '#a855f7',
            }
          },
          fontFamily: {
            heading: ['system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #07090E;
      color: #e2e8f0;
    }
    .glass {
      background: rgba(30, 41, 59, 0.4);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-center items-center px-4 relative overflow-hidden">
  <!-- Dynamic Background -->
  <div class="absolute inset-0 z-0 pointer-events-none">
    <div class="absolute top-[-20%] left-[-10%] w-[50%] h-[50%] rounded-full bg-autonoma-cyan/10 blur-[120px]"></div>
    <div class="absolute bottom-[-20%] right-[-10%] w-[50%] h-[50%] rounded-full bg-autonoma-purple/10 blur-[120px]"></div>
  </div>

  <div class="relative z-10 w-full max-w-md">
    <div class="text-center mb-10">
      <div class="w-16 h-16 mx-auto rounded-2xl bg-gradient-to-br from-autonoma-cyan to-autonoma-purple flex items-center justify-center font-black text-white text-3xl shadow-[0_0_30px_rgba(8,145,178,0.4)] mb-6">A</div>
      <h1 class="text-3xl font-black text-white font-heading tracking-tight mb-2">Welcome Back</h1>
      <p class="text-slate-400 font-medium">Sign in to your Autonoma enterprise dashboard.</p>
    </div>

    <div class="glass p-8 rounded-[2rem] border border-white/5 shadow-2xl">
      <form class="space-y-6" onsubmit="event.preventDefault()">
        <div>
          <label class="block text-sm font-bold text-slate-400 mb-2">Work Email</label>
          <input type="email" placeholder="name@company.com" class="w-full bg-slate-900/50 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-autonoma-cyan focus:ring-1 focus:ring-autonoma-cyan transition-all"/>
        </div>
        
        <div>
          <div class="flex justify-between mb-2">
             <label class="block text-sm font-bold text-slate-400">Password</label>
             <a href="#" class="text-xs font-bold text-autonoma-cyan hover:underline">Forgot?</a>
          </div>
          <div class="relative">
            <input type="password" placeholder="••••••••" class="w-full bg-slate-900/50 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-autonoma-cyan focus:ring-1 focus:ring-autonoma-cyan transition-all"/>
            <i data-lucide="lock" class="w-4 h-4 absolute right-4 top-1/2 -translate-y-1/2 text-slate-500"></i>
          </div>
        </div>

        <button class="w-full py-3.5 bg-gradient-to-r from-autonoma-cyan to-blue-600 rounded-xl text-sm font-bold text-white shadow-lg hover:shadow-autonoma-cyan/25 transition-all">
          Sign In
        </button>
        
        <div class="relative py-4">
          <div class="absolute inset-0 flex items-center">
            <div class="w-full border-t border-slate-700/50"></div>
          </div>
          <div class="relative flex justify-center text-sm">
            <span class="px-4 text-slate-500 bg-[#0c1017]">Or</span>
          </div>
        </div>

        <button class="w-full py-3.5 bg-white text-slate-900 rounded-xl text-sm font-bold hover:bg-slate-100 transition-all flex items-center justify-center gap-3">
          <svg class="w-5 h-5" viewBox="0 0 24 24">
             <path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
             <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
             <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
             <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
          </svg>
          Continue with Google
        </button>
      </form>
    </div>

    <p class="text-center mt-8 text-sm text-slate-500 font-medium">
      Don't have an enterprise account? <a href="index.html" class="text-autonoma-cyan hover:underline">Contact Sales</a>
    </p>
  </div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    lucide.createIcons();
  </script>
</body>
</html>
